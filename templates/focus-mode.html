<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f7f1e8 0%, #e8dcc9 100%);
            font-family: Georgia, serif;
            color: #2b2b2b;
        }

        .page-wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 3rem 1.25rem;
        }

        .note-card {
            background: rgba(255, 253, 249, 0.96);
            border-radius: 24px;
            box-shadow: 0 18px 40px rgba(88, 65, 37, 0.15);
            padding: 2rem;
        }

        textarea {
            min-height: 340px;
            resize: vertical;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <div class="note-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1">Personal Notes</h1>
                    <p class="text-muted mb-0">A calm writing space for quick thoughts and reminders.</p>
                </div>
                <a href="{{ url_for('home') }}" class="btn btn-outline-secondary btn-sm">Back</a>
            </div>
            <div class="mb-3">
                <label class="form-label">Today's priorities</label>
                <input class="form-control" placeholder="Write your top goals for the day">
            </div>
            <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea class="form-control" placeholder="Draft ideas, reminders, meeting notes..."></textarea>
            </div>
            <div class="small text-muted">This page is intentionally simple for quick exit situations.</div>
        </div>
    </div>
</body>
</html>
